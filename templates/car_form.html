{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
  <h2>Подать объявление</h2>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="mb-3">
        {{ field.label_tag }}
        {{ field }}
        {% for error in field.errors %}
          <div class="text-danger small">{{ error }}</div>
        {% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-dark">Создать</button>
  </form>
</div>
{% endblock %}
